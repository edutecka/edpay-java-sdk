name: SDK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          mvn-mirrors: maven-central-mirror:https://maven-central.storage-download.googleapis.com/maven2:central
      - run: mvn --batch-mode --no-transfer-progress clean verify
