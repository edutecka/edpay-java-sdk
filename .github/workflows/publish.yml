name: Publish Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish, for example v1.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username-env-var: SONATYPE_USERNAME
          server-password-env-var: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          mvn-mirrors: maven-central-mirror:https://maven-central.storage-download.googleapis.com/maven2:central

      - name: Verify release tag matches Maven version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          version = root.findtext("{http://maven.apache.org/POM/4.0.0}version")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY

      - name: Check publication credentials are present
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD MAVEN_GPG_PASSPHRASE MAVEN_GPG_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before publishing."
              exit 1
            fi
          done

      - name: Publish signed artifacts to Maven Central
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release clean deploy
